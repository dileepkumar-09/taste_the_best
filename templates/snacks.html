<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='js/cart.js') }}"></script>
</head>
<body>
    <nav>
        <a href="/home">Home</a>
        <a href="/cart">Cart</a>
        <a href="/logout">Logout</a>
    </nav>
    <h2 style="text-align:center;">Handcrafted Snacks</h2>
    <div class="product-grid">
        {% for product in products %}
        <div class="product-card">
            <img src="{{ url_for('static', filename='images/' + product.name.replace(' ', '_').lower() + '.jpg') }}" alt="{{ product.name }}">
            
            <h3>{{ product.name }}</h3>
            <select id="weight-{{ product.id }}">
                {% for weight, price in product.weights.items() %}
                <option value="{{ price }}">{{ weight }}g - ₹{{ price }}</option>
                {% endfor %}
            </select>
            <button class="btn-green" onclick="addToCart('{{ product.name }}', '{{ product.id }}')">Add to Cart</button>
        </div>
        {% endfor %}
    </div>
</body>
</html>

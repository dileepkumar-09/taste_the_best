<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-container">
        <h2>Order Checkout</h2>
        <form action="/checkout" method="post" onsubmit="prepareData()">
            <input type="text" name="name" placeholder="Full Name" required>
            <textarea name="address" placeholder="Delivery Address" required style="width:100%; height:80px;"></textarea>
            <input type="text" name="phone" placeholder="Phone Number" required>
            
            <input type="hidden" name="cart_data" id="cart_data">
            <input type="hidden" name="total_amount" id="total_amount">
            
            <button type="submit" class="btn-green">Confirm Order (Cash on Delivery)</button>
        </form>
    </div>

    <script>
        function prepareData() {
            const cart = localStorage.getItem('cart') || '[]';
            const data = JSON.parse(cart);
            let total = 0;
            data.forEach(item => total += parseInt(item.price));
            
            document.getElementById('cart_data').value = cart;
            document.getElementById('total_amount').value = total;
            
            // Clear cart after submitting
            localStorage.removeItem('cart');
        }
    </script>
</body>
</html>

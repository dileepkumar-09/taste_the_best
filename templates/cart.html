<!DOCTYPE html>
<html>
<head>
    <title>Your Shopping Cart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="/home">Home</a>
        <a href="/logout">Logout</a>
    </nav>
    <div class="auth-container" style="max-width: 700px;">
        <h2>Your Shopping Cart</h2>
        <table style="width: 100%; border-bottom: 1px solid #ddd; margin-bottom: 20px;">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Price</th>
                    <th>Weight</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="cart-items"></tbody>
        </table>
        <h3>Total: ₹<span id="total-price">0</span></h3>
        <a href="/checkout" class="btn-green" style="display: block; text-decoration: none;">Proceed to Checkout</a>
    </div>

    <script>
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const container = document.getElementById('cart-items');
            let total = 0;
            container.innerHTML = '';
            cart.forEach((item, index) => {
                total += parseInt(item.price);
                container.innerHTML += `
                    <tr>
                        <td><img src="/static/images/${item.name.toLowerCase().replace(/ /g, '_')}.jpg" style="width:50px;"></td>
                        <td>${item.name}</td>
                        <td>₹${item.price}</td>
                        <td>${item.weight}g</td>
                        <td><button onclick="removeItem(${index})">Remove</button></td>
                    </tr>`;
            });
            document.getElementById('total-price').innerText = total;
        }
        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart'));
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }
        window.onload = loadCart;
    </script>
</body>
</html>

{% extends "base.html" %}

{% block title %}Your Shopping Cart{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 700px;">
    <h2>Your Shopping Cart</h2>
    <table style="width: 100%; border-bottom: 1px solid #ddd; margin-bottom: 20px;">
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Weight</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="cart-items"></tbody>
    </table>
    <h3>Total: ₹<span id="total-price">0</span></h3>
    <a href="/checkout" class="btn-green" style="display: block; text-decoration: none;">Proceed to Checkout</a>
</div>
{% endblock %}

{% block scripts %}
<script>
    function loadCart() {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const container = document.getElementById('cart-items');
        let total = 0;
        container.innerHTML = '';
        cart.forEach((item, index) => {
            total += parseInt(item.price);
            
            // Extract base product name to avoid broken images for customized items
            let baseName = item.name.split(' (')[0];
            let imgName = baseName.toLowerCase().replace(/ /g, '_') + '.jpg';
            
            container.innerHTML += `
                <tr>
                    <td style="padding: 10px 0;"><img src="/static/images/${imgName}" style="width:55px; height:55px; border-radius:6px; object-fit:cover; border:1px solid #e2e8f0;" onerror="this.src='/static/images/default.jpg'"></td>
                    <td style="font-weight: 500; color: #1e293b;">${item.name}</td>
                    <td style="color: #64748b;">₹${item.price}</td>
                    <td style="color: #64748b;">${item.weight}g</td>
                    <td><button class="btn-green" style="padding: 6px 12px; font-size: 0.85rem; background-color: #ef4444;" onclick="removeItem(${index})">Remove</button></td>
                </tr>`;
        });
        document.getElementById('total-price').innerText = total;
    }
    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('cart'));
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        loadCart();
        
        // Notify common header if cart count helper exists
        if (typeof updateCartCount === 'function') {
            updateCartCount();
        }
    }
    window.onload = loadCart;
</script>
{% endblock %}
